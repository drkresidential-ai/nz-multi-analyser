
name: Update sports odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Download NBA odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          from datetime import datetime, timezone

          params = urllib.parse.urlencode({
              "apiKey": os.environ["ODDS_API_KEY"],
              "regions": "au",
              "markets": "h2h",
              "oddsFormat": "decimal"
          })

          url = (
              "https://api.the-odds-api.com/v4/sports/"
              "basketball_nba/odds/?" + params
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "NZMultiAnalyser/1.0"}
          )

          with urllib.request.urlopen(
              request, timeout=30
          ) as response:
              events = json.load(response)

          os.makedirs("data", exist_ok=True)

          with open("data/odds.json", "w") as f:
              json.dump({
                  "updated_at": datetime.now(
                      timezone.utc
                  ).isoformat(),
                  "sport": "NBA",
                  "source": "The Odds API",
                  "region": "au",
                  "is_live_tab_nz": False,
                  "events": events
              }, f, indent=2)
          PY

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odds.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NBA odds data"
            git push
          fi
